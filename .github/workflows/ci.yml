name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # No `version:` — it conflicts with `packageManager: pnpm@9.x` in
      # package.json (pnpm/action-setup@v4 errors on the duplicate).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check invariants
        run: pnpm check:invariants

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://nexus-web-joses-projects-64c7bb4d.vercel.app

  link-check:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --exclude-path node_modules
            --exclude-path .next
            --exclude '^https?://localhost'
            --exclude '^mailto:'
            './**/*.md' './**/*.mdx' './**/*.tsx'
          fail: true
